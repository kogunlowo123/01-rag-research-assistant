name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.10.10"
  GITLEAKS_VERSION: "8.29.0"

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan working tree
        run: gitleaks dir . --config .gitleaks.toml --redact --verbose --exit-code 1

      - name: Scan full git history
        run: gitleaks git . --config .gitleaks.toml --redact --verbose --exit-code 1

  static-analysis:
    name: Static analysis (bandit + semgrep rules)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Bandit
        run: uv run bandit -c pyproject.toml -r src -f screen

  dependencies:
    name: Dependency vulnerabilities (pip-audit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Export resolved dependency set
        run: |
          uv export --locked --no-emit-project --no-hashes --format requirements-txt --output-file requirements.audit.txt

      - name: pip-audit
        run: |
          set -euo pipefail
          ARGS=()
          if [ -f security/audit-ignores.txt ]; then
            while read -r line; do
              case "$line" in ''|'#'*) continue ;; esac
              ARGS+=(--ignore-vuln "$line")
            done < security/audit-ignores.txt
          fi
          # --no-deps audits the locked set exactly as resolved. Any ignored
          # identifier must have a dated justification in
          # security/audit-exceptions.md; see CONTRIBUTING.md.
          uvx pip-audit --strict --no-deps --requirement requirements.audit.txt "${ARGS[@]}"

  codeql:
    name: CodeQL
    # Code scanning is available on public repositories, and on private ones
    # only with GitHub Advanced Security. Running it on a private repository
    # without GHAS fails at the upload step for a reason unrelated to the code,
    # so the job is skipped there rather than reporting a false failure.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-extended

      - name: Analyse
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:python

  filesystem:
    name: Filesystem vulnerability scan (trivy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          scanners: vuln,secret,misconfig
        env:
          TRIVY_SKIP_DB_UPDATE: false
